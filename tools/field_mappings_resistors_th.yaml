# Field name normalization mappings for KiCad symbol library - RESISTORS (Through-Hole)
#
# This file defines how different field names in KiCad symbols should be
# normalized to consistent database column names for the resistors_th table.
#
# Format:
#   field_mappings:
#     original_field_name: normalized_name  # Exact match mappings
#
#   field_mapping_patterns:  # Regex pattern-based mappings
#     - pattern: '^regex_pattern$'  # Use full regex syntax
#       replacement: normalized_name
#
#   column_edits:
#     column_name: add           # Add this column even if not in symbol data
#     '^regex_pattern': remove   # Remove columns matching regex pattern
#
# Note: Symbol and Footprint fields are automatically added (required for db-lib).
# Fields without a mapping will use their original name as the column name
# (after sanitization for SQL compatibility).

field_mappings:
  # Dual EDA support - rename generic fields to EDA-specific names
  "Symbol": "kicad_symbol"
  "Footprint": "kicad_footprint"

  # Old schema to new schema field name mappings (PascalCase → snake_case)
  "Symbol_Name": "part_locator"
  "KiCad_Symbol": "kicad_symbol"
  "KiCad_Footprint": "kicad_footprint"
  "Altium_Symbol": "altium_symbol"
  "Altium_Footprint": "altium_footprint"
  "Description": "description"
  "Datasheet": "datasheet"
  "Manufacturer": "manufacturer"
  "MPN": "mpn"
  "Value": "value"
  "Tolerance": "tolerance"
  "Power_Rating": "power_rating"
  "Voltage_Rating": "voltage_rating"
  "Material": "composition"
  "Temp_Coeff": "temp_coeff"
  "Temp_Operating": "temp_operating"
  "Temp_Soldering": "temp_soldering"
  "Temp_Storage": "temp_storage"
  "Sim_Device": "sim_device"
  "Sim_Pins": "sim_pins"
  "Sim_Type": "sim_model_type"
  "Sim_Library": "sim_model_file"
  "Sim.Device": "sim_device"
  "Sim.Pins": "sim_pins"
  "Sim.Type": "sim_model_type"
  "Sim.Library": "sim_model_file"
  "Part_ID": "part_locator"
  "Allow_Substitution": "allow_substitution"
  "BOM_Comment": "bom_comment"
  "Standards_Version": "standards_version"
  "Tracking": "tracking"
  "RoHS": "rohs"
  "RoHS_Document_Link": "rohs_document_link"
  "Manufacturer_Link": "manufacturer_link"

  # Through-hole specific mappings
  "Lead_Spacing": "lead_spacing_mm"
  "Lead Spacing": "lead_spacing_mm"
  "Lead_Spacing_mm": "lead_spacing_mm"
  "Body_Style": "body_style"
  "Body Style": "body_style"

  # Space variations of field names (from legacy symbols)
  "Allow Substitution": "allow_substitution"
  "BOM Comment": "bom_comment"
  "Manufacturer Link": "manufacturer_link"
  "Standards Version": "standards_version"
  "Power Rating": "power_rating"
  "Voltage Rating": "voltage_rating"
  "RoHS Document Link": "rohs_document_link"

  # Manufacturer part number variations
  "Manufacturer_PN": "mpn"
  "Manufacturer PN": "mpn"
  "Mfr PN": "mpn"
  "Part Number": "mpn"

  # RoHS Document Link variations
  "RoHS Europe Document Link": "rohs_document_link"
  "RoHS Link_1": "rohs_document_link"
  "RoHS Link": "rohs_document_link"

  # Temperature coefficients and variations
  "Temp Coeff": "temp_coeff"
  "Temp Coeff.": "temp_coeff"
  "Temperature Coefficient": "temp_coeff"
  "Temp (Operating)": "temp_operating"
  "Temp (Soldering)": "temp_soldering"
  "Temp (Storage)": "temp_storage"

  # Voltage variations
  "Voltage": "voltage_rating"
  "Voltage Rating": "voltage_rating"

  # Power variations
  "Power": "power_rating"
  "Power Rating": "power_rating"

  # Other common variations
  "Desc": "description"
  "Tol": "tolerance"
  "Ref": "Reference"

# Field mapping patterns - use regex to map multiple fields to one column
# Patterns are checked in order, first match wins
field_mapping_patterns: {}

# Column edits - add or remove columns from the database schema
# Supports regex patterns for remove operations
column_edits:
    # Core fields to add (per resistors_th_0_schema.sql)
    "part_locator": add
    "variant": add
    "lifecycle_status": add
    "created_at": add
    "updated_at": add
    "created_by": add
    "source": add
    "dump_priority": add
    "altium_symbol": add
    "altium_footprint": add
    "sim_params": add

    # Through-hole specific fields to add
    "lead_spacing_mm": add
    "body_style": add

    # Remove KiCad internal fields
    "^ki_.*": remove

    # Remove legacy/unused fields
    "RoHS China Document Link": remove
    "RoHS China Link": remove
    "Component Value": remove
    "Component_Value": remove
    "Fitted": remove
    "Class": remove
    "Component Type": remove
    "Component_Type": remove
    "Current Rating": remove
    "Current_Rating": remove
    "Current rating": remove
    "Current": remove
    "Number of Pins": remove
    "Number_of_Pins": remove
    "Reference": remove

    # Remove SMT-specific fields
    "Package": remove
    "package": remove
    "Package Type": remove
    "Package Variant": remove

# Note: SPICE simulation fields (Sim.Device, Sim.Pins, Sim.Type, Sim.Library) are
# automatically added by the script for KiCad simulation support
